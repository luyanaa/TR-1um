# TR-1um mixed-signal counter diagnostic template.
#
# This legacy profile is intentionally not a signoff entry point. Use
# config_access.yaml for the mixed-signal run that carries the active
# electrical/PDN policy and the explicit signoff artifacts.
meta:
  version: 3
  flow: Classic
  signoff_profile: diagnostic_only
  signoff_profile_source: config_access.yaml
  substituting_steps:
    Magic.StreamOut: null
    Magic.WriteLEF: null
    Magic.DRC: null
    Magic.SpiceExtraction: null
    Netgen.LVS: null
    Checker.LVS: null
    Checker.MagicDRC: null
    Checker.IllegalOverlap: null
    Odb.CheckDesignAntennaProperties: null
    Odb.CheckMacroAntennaProperties: null
    Klayout.XOR: null
    Checker.XOR: null

DESIGN_NAME: tr1um_mixed_counter
VERILOG_FILES: dir::src/tr1um_mixed_counter.v

CLOCK_PORT: clk
CLOCK_PERIOD: 5000
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
FALLBACK_SDC: dir::constraints.sdc

VDD_NETS: [VDD]
GND_NETS: [GND]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

MACROS:
  CMC_S_NMOS_B_X1_Y1:
    gds:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.gds
    lef:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.lef
    nl:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.bb.v
    instances:
      u_ana:
        location: [300, 300]
        orientation: N

FP_SIZING: absolute
DIE_AREA: [0, 0, 1600, 1200]
CORE_AREA: [50, 50, 1550, 1150]
PL_TARGET_DENSITY_PCT: 20
GRT_ALLOW_CONGESTION: true

RUN_CTS: false
RUN_FILL_INSERTION: false
# Diagnostic profile: these stages are not a release signoff.
RUN_DRT: false
RUN_SPEF_EXTRACTION: false
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_ANTENNA_REPAIR: false
DIODE_ON_PORTS: in
RUN_IRDROP_REPORT: false
RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_DRC: true
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_DRC: false
RUN_LVS: false
RUN_MCSTA: false
TIMING_VIOLATION_CORNERS: []
HOLD_VIOLATION_CORNERS: []

RUN_PDN: false
PDN_MULTILAYER: false
# Never allow this legacy profile to attach a macro to a guessed grid.
PDN_CONNECT_MACROS_TO_GRID: false
ERROR_ON_DISCONNECTED_PINS: true
ERROR_ON_PDN_VIOLATIONS: true
KLAYOUT_CONFLICT_RESOLUTION: AddToCell
