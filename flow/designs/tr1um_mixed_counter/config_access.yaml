# TR-1um mixed-signal counter with the qualified access-cell digital library.
# Digital logic uses the access-cell SCL; the analog leaf is the BEOL-escape
# macro with M2 landings (flow/align_macro/CMC_S_NMOS_B_X1_Y1.{gds,lef}).
meta:
  version: 3
  flow: Classic
  substituting_steps:
    Magic.StreamOut: null
    Magic.WriteLEF: null
    Magic.DRC: null
    Magic.SpiceExtraction: null
    Netgen.LVS: null
    Checker.LVS: null
    Checker.MagicDRC: null
    Checker.IllegalOverlap: null
    Odb.CheckDesignAntennaProperties: null
    Odb.CheckMacroAntennaProperties: null
    Klayout.XOR: null
    Checker.XOR: null
    OpenROAD.IRDropReport: null

DESIGN_NAME: tr1um_mixed_counter
VERILOG_FILES: dir::src/tr1um_mixed_counter.v
CLOCK_PORT: clk
CLOCK_PERIOD: 5000
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
FALLBACK_SDC: dir::constraints.sdc

VDD_NETS: [VDD]
GND_NETS: [GND]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Single source of truth for macro placement. The deprecated
# MACRO_PLACEMENT_CFG would silently override this block, so it is not set.
MACROS:
  CMC_S_NMOS_B_X1_Y1:
    gds:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.gds
    lef:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.lef
    nl:
      - dir::../../align_macro/CMC_S_NMOS_B_X1_Y1.bb.v
    instances:
      u_ana:
        location: [300, 300]
        orientation: N

FP_SIZING: absolute

GRT_OVERFLOW_ITERS: 0
DIE_AREA: [0, 0, 1600, 1200]
CORE_AREA: [50, 75.6, 1550, 1058.4]
PL_TARGET_DENSITY_PCT: 5
PL_ROUTABILITY_DRIVEN: false

# The access-cell library's active geometry is row-boundary asymmetric: a
# flipped cell puts its bottom-edge AP against the next row's AP, violating
# AP.S1. Disable the detailed-placement mirroring pass so cells stay N.
PL_OPTIMIZE_MIRRORING: false

GRT_ALLOW_CONGESTION: true
# The analog macro has no complete PG grid or VDD pin. Keep OpenROAD PDN off;
# any future enablement must prove macro-level power integrity independently.
RUN_PDN: false
ERROR_ON_DISCONNECTED_PINS: true
RUN_CTS: false
RUN_FILL_INSERTION: false
RUN_DRT: true
RUN_SPEF_EXTRACTION: true
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_ANTENNA_REPAIR: false
DIODE_ON_PORTS: in
RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_DRC: true
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_DRC: false
RUN_LVS: false
RUN_MCSTA: false
TIMING_VIOLATION_CORNERS: []
HOLD_VIOLATION_CORNERS: []

PDN_MULTILAYER: false
# If PDN is enabled for an experiment, do not defer power-grid violations.
PDN_CONNECT_MACROS_TO_GRID: false
ERROR_ON_PDN_VIOLATIONS: true
KLAYOUT_CONFLICT_RESOLUTION: AddToCell
